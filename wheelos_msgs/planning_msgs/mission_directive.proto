syntax = "proto2";

package apollo.planning;

import "wheelos_msgs/basic_msgs/geometry.proto";
import "wheelos_msgs/basic_msgs/header.proto";
import "wheelos_msgs/map_msgs/map_geometry.proto";
import "wheelos_msgs/planning_msgs/planning_command.proto";

message MissionCommandIdentity {
  optional string producer_epoch = 1;
  optional string aggregate_id = 2;
  optional string command_id = 3;
  optional uint64 revision = 4;
}

enum MissionTaskType {
  MISSION_TASK_UNKNOWN = 0;
  MISSION_TASK_A_TO_B = 1;
  MISSION_TASK_PARK_IN = 2;
  MISSION_TASK_PULL_OVER = 3;
  MISSION_TASK_DOCK = 4;
  MISSION_TASK_SUMMON = 5;
  MISSION_TASK_PARK_OUT = 6;
  MISSION_TASK_ESCAPE = 7;
  MISSION_TASK_ROTATE_IN_PLACE = 8;
  MISSION_TASK_REACH_POSE = 9;
  MISSION_TASK_STANDSTILL_WAIT = 10;
}

enum MissionTravelPermission {
  MISSION_TRAVEL_UNKNOWN = 0;
  MISSION_TRAVEL_FORWARD_ONLY = 1;
  MISSION_TRAVEL_REVERSE_ONLY = 2;
  MISSION_TRAVEL_FORWARD_AND_REVERSE = 3;
}

message MissionEscapePolicy {
  optional apollo.hdmap.Polygon permitted_region = 1;
  optional double max_total_distance_m = 2;
  optional uint32 max_motion_segments = 3;
  optional uint32 max_direction_changes = 4;
  optional MissionCommandIdentity source_attempt_identity = 5;
  // Time/retry budgets use completion.timeout_sec and recovery.retry_budget
  // cumulatively across the logical authorization, not per attempt.
}

message MissionRotationPolicy {
  optional apollo.common.PointENU pivot_position = 1;
  optional bool clockwise = 2;
  optional double max_position_deviation_m = 3;
  optional double max_absolute_angular_travel_rad = 4;
  optional double max_wrong_direction_excursion_rad = 5;
}

message MissionParkingPolicy {
  optional apollo.hdmap.Polygon terminal_region = 1;
  optional string region_resolver_id = 2;
}

message MissionPullOverPolicy {
  optional apollo.hdmap.Polygon search_region = 1;
  optional apollo.hdmap.Polygon terminal_region = 2;
  optional bool allow_target_reselection = 3 [default = false];
  optional string target_resolver_id = 4;
}

message MissionStandstillWaitPolicy {
  optional double dwell_duration_sec = 1;
}

message MissionParkingExitPolicy {
  optional apollo.hdmap.Polygon initial_parking_region = 1;
  optional apollo.hdmap.Polygon permitted_exit_region = 2;
}

message ExplicitMissionStart {
  optional apollo.common.PointENU position = 1;
  optional double heading = 2;
  optional string reference_frame_id = 3;
  optional double max_position_error_m = 4;
  optional double max_heading_error_rad = 5;
}

message MissionStart {
  oneof source {
    bool current_pose_at_acceptance = 1;
    ExplicitMissionStart explicit_start = 2;
  }
}

message MissionStartSnapshot {
  optional apollo.common.PointENU position = 1;
  optional double heading = 2;
  optional string reference_frame_id = 3;
  optional double snapshot_time_sec = 4;
}

message MissionPlan {
  optional MissionTaskType task_type = 1;
  optional MissionStart start = 2;
  optional GoalSpec goal = 3;
  optional RouteHint route_hint = 4;
  optional PlanningMode preferred_mode = 5;
  optional uint32 priority = 6;
  optional bool preemptible = 7 [default = true];
  optional CompletionCondition completion = 8;
  optional FallbackPolicy fallback = 9;
  optional RecoveryPolicy recovery = 10;
  optional DomainPolicy domain_policy = 11;
  optional OpenSpaceCommandContext open_space = 12;
  repeated string tags = 13;
  optional MissionTravelPermission travel_permission = 14;
  optional string budget_authorization_id = 15;
  // Mission assigns budget IDs; a caller cannot replenish an existing budget.
  oneof task_policy {
    MissionParkingPolicy parking = 20;
    MissionPullOverPolicy pull_over = 21;
    MissionEscapePolicy escape = 22;
    MissionRotationPolicy rotation = 23;
    MissionStandstillWaitPolicy standstill_wait = 24;
    MissionParkingExitPolicy parking_exit = 25;
  }
}

message MissionActivate {
  optional MissionPlan plan = 1;
}

message MissionReplace {
  optional MissionCommandIdentity expected_active_identity = 1;
  optional MissionPlan plan = 2;
}

enum MissionCancelPostcondition {
  MISSION_CANCEL_POSTCONDITION_UNKNOWN = 0;
  MISSION_CANCEL_CONTROLLED_STOP_THEN_HOLD = 1;
}

message MissionCancel {
  optional MissionCommandIdentity expected_active_identity = 1;
  optional MissionCancelPostcondition postcondition = 2
      [default = MISSION_CANCEL_CONTROLLED_STOP_THEN_HOLD];
  optional string reason = 3;
}

// Completion of suspension requires controlled stop and measured idle hold.
message MissionSuspend {
  optional MissionCommandIdentity expected_active_identity = 1;
  optional string reason = 2;
}

// A resume requires fresh start validation and explicit live reauthorization.
message MissionResume {
  optional MissionCommandIdentity expected_active_identity = 1;
}

message MissionDirective {
  optional apollo.common.Header header = 1;
  optional MissionCommandIdentity identity = 2;

  oneof operation {
    MissionActivate activate = 10;
    MissionReplace replace = 11;
    MissionCancel cancel = 12;
    MissionSuspend suspend = 13;
    MissionResume resume = 14;
  }
}

enum MissionSessionState {
  MISSION_SESSION_UNKNOWN = 0;
  MISSION_SESSION_ACCEPTED = 1;
  MISSION_SESSION_EXECUTING = 2;
  MISSION_SESSION_SUSPENDED = 3;
  MISSION_SESSION_CANCELLING = 4;
  MISSION_SESSION_COMPLETING = 5;
  MISSION_SESSION_COMPLETED = 6;
  MISSION_SESSION_CANCELLED = 7;
  MISSION_SESSION_FAILED = 8;
}

enum MissionSessionPhase {
  MISSION_PHASE_UNKNOWN = 0;
  MISSION_PHASE_ROUTING = 1;
  MISSION_PHASE_ENROUTE = 2;
  MISSION_PHASE_APPROACH = 3;
  MISSION_PHASE_HANDOFF = 4;
  MISSION_PHASE_LOCAL_MANEUVER = 5;
  MISSION_PHASE_SETTLING = 6;
}

enum MissionRouteState {
  MISSION_ROUTE_NONE = 0;
  MISSION_ROUTE_REQUESTED = 1;
  MISSION_ROUTE_READY = 2;
  MISSION_ROUTE_FAILED = 3;
}

message MissionRouteContext {
  optional string request_id = 1;
  optional bytes map_version = 2;
  optional string route_id = 3;
  optional MissionRouteState state = 4;
  optional string reason = 5;
}
