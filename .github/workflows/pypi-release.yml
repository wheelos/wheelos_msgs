name: Publish wheelos_msgs to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bazel
        uses: bazelbuild/setup-bazelisk@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MODULE_VERSION="$(sed -n 's/^[[:space:]]*version = "\([^"]*\)".*/\1/p' MODULE.bazel | head -n 1)"
          WHEEL_VERSION="$(sed -n 's/^[[:space:]]*version = "\([^"]*\)".*/\1/p' BUILD | head -n 1)"
          test -n "$VERSION"
          test "$VERSION" = "$MODULE_VERSION"
          test "$VERSION" = "$WHEEL_VERSION"

      - name: Build protobuf targets and wheel
        run: bazel build //wheelos_msgs/... //:wheelos_msgs_wheel.dist

      - name: Check wheel metadata
        run: |
          python -m pip install --disable-pip-version-check twine
          twine check bazel-bin/wheelos_msgs_wheel_dist/*.whl

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: bazel-bin/wheelos_msgs_wheel_dist
